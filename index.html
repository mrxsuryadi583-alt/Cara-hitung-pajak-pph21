<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator PPh 21 - Admin & Karyawan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <header class="bg-blue-700 text-white p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap gap-2 justify-between items-center">
            <h1 class="text-xl font-bold">Kalkulator & Dashboard PPh 21</h1>
            <div id="authStatus" class="text-sm flex items-center"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <section class="bg-white p-6 rounded-lg shadow-md lg:col-span-1" aria-labelledby="formTitle">
            <h2 id="formTitle" class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">Form Input Gaji Karyawan</h2>
            <form id="pphForm" class="space-y-4">
                <div>
                    <label for="employeeName" class="block text-sm font-medium mb-1">Nama Karyawan</label>
                    <input type="text" id="employeeName" required maxlength="80" class="w-full border rounded p-2 focus:ring focus:ring-blue-300 outline-none" placeholder="Masukkan nama">
                </div>

                <div>
                    <label for="ptkpStatus" class="block text-sm font-medium mb-1">Status PTKP</label>
                    <select id="ptkpStatus" class="w-full border rounded p-2 focus:ring focus:ring-blue-300 outline-none">
                        <option value="TK/0">TK/0 (Tidak Kawin, 0 Tanggungan - Rp54 Juta)</option>
                        <option value="TK/1">TK/1 (Tidak Kawin, 1 Tanggungan - Rp58,5 Juta)</option>
                        <option value="TK/2">TK/2 (Tidak Kawin, 2 Tanggungan - Rp63 Juta)</option>
                        <option value="TK/3">TK/3 (Tidak Kawin, 3 Tanggungan - Rp67,5 Juta)</option>
                        <option value="K/0">K/0 (Kawin, 0 Tanggungan - Rp58,5 Juta)</option>
                        <option value="K/1">K/1 (Kawin, 1 Tanggungan - Rp63 Juta)</option>
                        <option value="K/2">K/2 (Kawin, 2 Tanggungan - Rp67,5 Juta)</option>
                        <option value="K/3">K/3 (Kawin, 3 Tanggungan - Rp72 Juta)</option>
                    </select>
                </div>

                <div>
                    <label for="monthlySalary" class="block text-sm font-medium mb-1">Gaji Bruto Bulanan (Rp)</label>
                    <input type="number" id="monthlySalary" required min="0" class="w-full border rounded p-2 focus:ring focus:ring-blue-300 outline-none" placeholder="Contoh: 10000000">
                </div>

                <div>
                    <label for="monthlyAllowance" class="block text-sm font-medium mb-1">Tunjangan & Bonus Bulanan (Rp)</label>
                    <input type="number" id="monthlyAllowance" min="0" value="0" class="w-full border rounded p-2 focus:ring focus:ring-blue-300 outline-none" placeholder="0">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-semibold transition">Hitung & Simpan Pajak</button>
            </form>
        </section>

        <section class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-bold text-gray-700">Tabel Perhitungan PPh 21 Karyawan</h2>
                    <button type="button" id="btnClear" class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded hover:bg-red-200">Hapus Semua Data</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 border-b">
                                <th scope="col" class="p-3">Nama</th>
                                <th scope="col" class="p-3">PTKP</th>
                                <th scope="col" class="p-3">Gaji Bruto</th>
                                <th scope="col" class="p-3">PPh 21 /Bulan</th>
                                <th scope="col" class="p-3">PPh 21 /Tahun</th>
                                <th scope="col" class="p-3">Gaji Bersih (THP)</th>
                            </tr>
                        </thead>
                        <tbody id="taxTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">Grafik Ringkasan PPh 21 (Bulanan vs Tahunan)</h2>
                <div class="relative h-64">
                    <canvas id="taxChart" role="img" aria-label="Grafik batang PPh 21 bulanan dan tahunan per karyawan"></canvas>
                </div>
            </div>
        </section>
    </main>

    <div id="loginModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
        <form id="loginForm" class="bg-white rounded-lg p-6 w-full max-w-md shadow-xl">
            <h3 id="loginTitle" class="text-lg font-bold mb-4">Login Admin Internal</h3>
            <div class="space-y-4">
                <div>
                    <label for="loginEmail" class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="loginEmail" required class="w-full border rounded p-2" placeholder="admin@perusahaan.com">
                </div>
                <div>
                    <label for="loginPassword" class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full border rounded p-2" placeholder="******">
                </div>
                <p class="text-xs text-amber-700 bg-amber-50 p-2 rounded">Demo: login ini hanya simulasi di browser, bukan autentikasi sungguhan.</p>
                <div class="flex justify-end gap-2">
                    <button type="button" id="btnCancelLogin" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Login</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        let taxRecords = [];
        let chartInstance = null;
        let loggedInEmail = null;

        const PTKP = {
            'TK/0': 54000000, 'TK/1': 58500000, 'TK/2': 63000000, 'TK/3': 67500000,
            'K/0': 58500000, 'K/1': 63000000, 'K/2': 67500000, 'K/3': 72000000
        };

        const TIERS = [
            [60000000, 0.05],
            [190000000, 0.15],
            [250000000, 0.25],
            [4500000000, 0.30],
            [Infinity, 0.35]
        ];

        const rupiah = n => 'Rp ' + n.toLocaleString('id-ID');

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function calculatePPh21(grossMonthly, ptkp) {
            const annualGross = grossMonthly * 12;
            const jabatanCost = Math.min(annualGross * 0.05, 6000000);
            const netAnnual = annualGross - jabatanCost;
            // PKP dibulatkan ke bawah ke ribuan penuh
            const pkp = Math.floor(Math.max(0, netAnnual - PTKP[ptkp]) / 1000) * 1000;

            let annualTax = 0;
            let remaining = pkp;
            for (const [width, rate] of TIERS) {
                if (remaining <= 0) break;
                const portion = Math.min(remaining, width);
                annualTax += portion * rate;
                remaining -= portion;
            }

            const monthlyTax = annualTax / 12;
            return {
                monthlyTax: Math.round(monthlyTax),
                annualTax: Math.round(annualTax),
                takeHomePay: Math.round(grossMonthly - monthlyTax)
            };
        }

        document.getElementById('pphForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('employeeName').value.trim();
            const ptkp = document.getElementById('ptkpStatus').value;
            const salary = Math.max(0, parseFloat(document.getElementById('monthlySalary').value) || 0);
            const allowance = Math.max(0, parseFloat(document.getElementById('monthlyAllowance').value) || 0);
            if (!name) return;

            const gross = salary + allowance;
            const r = calculatePPh21(gross, ptkp);
            taxRecords.push({ name, ptkp, gross, monthlyTax: r.monthlyTax, annualTax: r.annualTax, thp: r.takeHomePay });

            updateTable();
            updateChart();
            this.reset();
            document.getElementById('employeeName').focus();
        });

        function updateTable() {
            const tbody = document.getElementById('taxTableBody');
            if (taxRecords.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-500">Belum ada data perhitungan.</td></tr>';
                return;
            }
            tbody.innerHTML = taxRecords.map(item => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 font-semibold">${escapeHtml(item.name)}</td>
                    <td class="p-3"><span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">${item.ptkp}</span></td>
                    <td class="p-3 whitespace-nowrap">${rupiah(item.gross)}</td>
                    <td class="p-3 whitespace-nowrap text-red-600 font-medium">${rupiah(item.monthlyTax)}</td>
                    <td class="p-3 whitespace-nowrap text-red-700 font-medium">${rupiah(item.annualTax)}</td>
                    <td class="p-3 whitespace-nowrap text-green-700 font-semibold">${rupiah(item.thp)}</td>
                </tr>
            `).join('');
        }

        function updateChart() {
            const ctx = document.getElementById('taxChart').getContext('2d');
            const hasData = taxRecords.length > 0;
            const data = {
                labels: hasData ? taxRecords.map(r => r.name) : ['Contoh'],
                datasets: [
                    { label: 'PPh 21 Per Bulan (Rp)', data: hasData ? taxRecords.map(r => r.monthlyTax) : [0], backgroundColor: 'rgba(59, 130, 246, 0.75)' },
                    { label: 'PPh 21 Per Tahun (Rp)', data: hasData ? taxRecords.map(r => r.annualTax) : [0], backgroundColor: 'rgba(239, 68, 68, 0.75)' }
                ]
            };

            if (chartInstance) {
                chartInstance.data = data;
                chartInstance.update();
                return;
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${rupiah(c.parsed.y)}` } }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { callback: v => v.toLocaleString('id-ID') } }
                    }
                }
            });
        }

        document.getElementById('btnClear').addEventListener('click', () => {
            if (taxRecords.length && !confirm('Hapus semua data perhitungan?')) return;
            taxRecords = [];
            updateTable();
            updateChart();
        });

        const modal = document.getElementById('loginModal');

        function renderAuthStatus() {
            const el = document.getElementById('authStatus');
            el.innerHTML = '';
            const span = document.createElement('span');
            span.className = 'mr-2';
            span.append(loggedInEmail ? 'Login sebagai: ' : 'Status: ');
            const strong = document.createElement('strong');
            strong.textContent = loggedInEmail || 'Tamu (Tanpa Login)';
            span.append(strong);

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = loggedInEmail ? 'Logout' : 'Login Admin';
            btn.className = loggedInEmail
                ? 'bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition'
                : 'bg-white text-blue-700 px-3 py-1 rounded hover:bg-gray-100 font-semibold transition';
            btn.addEventListener('click', () => {
                if (loggedInEmail) { loggedInEmail = null; renderAuthStatus(); }
                else openLoginModal();
            });
            el.append(span, btn);
        }

        function openLoginModal() {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('loginEmail').focus();
        }

        function closeLoginModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.getElementById('btnCancelLogin').addEventListener('click', closeLoginModal);
        modal.addEventListener('click', e => { if (e.target === modal) closeLoginModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeLoginModal(); });

        document.getElementById('loginForm').addEventListener('submit', e => {
            e.preventDefault();
            loggedInEmail = document.getElementById('loginEmail').value.trim();
            e.target.reset();
            renderAuthStatus();
            closeLoginModal();
        });

        renderAuthStatus();
        updateTable();
        updateChart();
    </script>
</body>
</html>
